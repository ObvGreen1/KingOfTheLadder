# The build asks for a Java 25 toolchain (see build.gradle.kts). Auto-detection is left ON so the
# build works on any machine with a JDK 25 installed anywhere, and auto-download stays OFF so no
# JDK is ever fetched from the network.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# To force one specific JDK 25 install instead, uncomment and point it at that path.
# The double backslashes are Gradle properties escaping; a single-backslash path will not work.
# org.gradle.java.installations.paths=C:\\path\\to\\jdk-25


# Match <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
