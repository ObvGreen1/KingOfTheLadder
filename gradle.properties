# Keep every JDK candidate explicit and local: no auto-probing of the machine,
# no auto-provisioned/downloaded JDKs. Only the Zulu 25 install listed below can
# satisfy `java.toolchain.languageVersion = 25` from build.gradle.kts.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:\\Program Files\\Zulu\\zulu-25

# Match <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
